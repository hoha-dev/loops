# loops gates for GitHub Actions. Copy to .github/workflows/loops.yml.
# Two jobs: the doc contract on every push (loops-gen --check + loops-check, the same gate the pre-push
# hook runs), and the agent-configuration evals when the configuration changes (playbook lesson 9),
# on a schedule, never with continue-on-error (AGENTS.md guardrail). The evals job needs
# ANTHROPIC_API_KEY as a repository secret and costs one model call per phrasing.
name: loops
on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * 1'   # weekly evals, Monday 02:00 UTC
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # loops-check reads branches (story/* claims) and main
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node scripts/loops-gen.mjs --check
      - run: node scripts/loops-check.mjs
  evals:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Only when the agent configuration changed (or on schedule)
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(CLAUDE\.md|AGENTS\.md|REVIEW\.md|\.claude/|skills/|evals/)'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == '1'
        run: npm install -g @anthropic-ai/claude-code
      - if: steps.changed.outputs.run == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash evals/run.sh
      - if: steps.changed.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with: { name: evals-last-run, path: evals/last-run.md }
